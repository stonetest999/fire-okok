<html lang="zh-Hant"><head><meta charset="utf-8">

<title>火晶建築升級規劃</title>
<style>
:root{--bg:#f6f4ef;--c:#fff;--t:#222;--m:#666;--b:#ddd;--a:#c2410c;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#161412;--c:#221f1c;--t:#eee;--m:#aaa;--b:#3a3631;--a:#fb923c;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif;padding:12px 12px 90px;max-width:1000px}
h1{font-size:20px}h2{font-size:16px;margin:0 0 8px;color:var(--a)}
section{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin:12px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{font-size:12px;color:var(--m);display:block}
input,select,button{font:inherit;width:100%;padding:7px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t)}
button{width:auto;background:var(--a);color:#fff;border:0;cursor:pointer;margin:4px 4px 0 0}
button.s{background:var(--b);color:var(--t)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
td,th{border-bottom:1px solid var(--b);padding:4px 6px;text-align:right}th{color:var(--m);font-weight:600}td:first-child,th:first-child{text-align:left}
td input{padding:3px;width:80px}td input[type=checkbox]{width:20px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.k div{background:var(--bg);border-radius:8px;padding:8px}.k b{display:block;font-size:18px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.ms{background:rgba(194,65,12,.12)}small{color:var(--m)}
.note{background:var(--bg);border-left:3px solid var(--a);padding:6px 10px;border-radius:4px;font-size:13px;margin:6px 0}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--b);padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:center}
#bar button{font-size:16px;padding:10px 18px;margin:0}#st{font-size:13px;color:var(--m)}#st.d{color:var(--bad);font-weight:600}
#hd{display:flex;justify-content:space-between;align-items:center;gap:8px}#hd h1{margin:12px 0}#lang{width:auto}
</style></head><body>
<div id="hd"><h1 data-i="h1"></h1>
<select id="lang" onchange="setLang(this.value)" aria-label="Language"><option value="zh">繁體中文</option><option value="ko">한국어</option><option value="en">English</option></select></div>
<div class="note" data-i="note"></div>

<section><h2 data-i="s1"></h2><div class="g" id="inp"></div>
<small id="dly"></small>
<h3 style="font-size:14px;margin:12px 0 4px" data-i="stgT"></h3><div class="w"><table id="stg"></table></div>
<h3 style="font-size:14px;margin:12px 0 4px" data-i="trT"></h3>
<div class="note" data-i="trN"></div>
<div class="w"><table id="tr"></table></div>
<button class="s" onclick="addTier()" data-i="add"></button>
<button class="s" onclick="if(confirm(T('cr'))){localStorage.removeItem('fcp2');location.reload()}" data-i="reset"></button></section>

let L='zh';
try{const x=localStorage.getItem(LKEY);if(x&&I[x])L=x;else{const n=(navigator.language||'').toLowerCase();L=n.startsWith('ko')?'ko':n.startsWith('en')?'en':'zh'}}catch(e){}
const T=(k,...a)=>{const v=I[L][k];return typeof v=='function'?v(...a):v};
function applyStatic(){document.documentElement.lang=L=='zh'?'zh-Hant':L;document.title=T('title');
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=T(e.dataset.i));$('lang').value=L}

/* ===== data ===== */
const D={fire:7000,ref:0,mon:4000,weeks:22,start:'2026-11-09',
stages:[{n:6,f:3150,r:197,done:false},{n:7,f:3726,r:293,done:false},{n:8,f:3726,r:414,done:false}],
tiers:[{n:7,f:70,r:10,on:true},{n:20,f:330,r:29,on:true},{n:26,f:540,r:41,on:true},{n:40,f:1240,r:72,on:true},{n:46,f:1690,r:91,on:true},{n:60,f:3090,r:135,on:true}],plan:[]};
let S=JSON.parse(JSON.stringify(D));
try{const x=localStorage.getItem(KEY);if(x)S=JSON.parse(x)}catch(e){}
const $=id=>document.getElementById(id),N=v=>Number(v)||0,fm=n=>Math.round(n).toLocaleString();
const F=[['fire'],['ref'],['mon'],['weeks'],['start','date']];
function dirty(){$('st').textContent=T('dirty');$('st').className='d';
$('dly').textContent=T('dly',(N(S.mon)/30).toFixed(1),fm(N(S.mon)))}
function inputs(){$('inp').innerHTML=F.map(([k,t])=>`<div><label>${T(k)}</label><input type="${t||'number'}" value="${S[k]}" oninput="S.${k}=this.type=='date'?this.value:N(this.value);dirty()"></div>`).join('');
$('dly').textContent=T('dly',(N(S.mon)/30).toFixed(1),fm(N(S.mon)));
$('stg').innerHTML=`<tr><th>${T('hStage')}</th><th>${T('hFire')}</th><th>${T('hRef')}</th><th>${T('hDone')}</th></tr>`+S.stages.map((s,i)=>`<tr><td><input value="${s.n}" oninput="S.stages[${i}].n=this.value;dirty()" style="width:50px"></td><td><input type=number value="${s.f}" oninput="S.stages[${i}].f=N(this.value);dirty()"></td><td><input type=number value="${s.r}" oninput="S.stages[${i}].r=N(this.value);dirty()"></td><td><input type=checkbox ${s.done?'checked':''} onchange="S.stages[${i}].done=this.checked;dirty()"></td></tr>`).join('');
$('tr').innerHTML=`<tr><th>${T('hUse')}</th><th>${T('hCnt')}</th><th>${T('hCost')}</th><th>${T('hGain')}</th><th>${T('hDel')}</th></tr>`+S.tiers.map((t,i)=>`<tr><td><input type=checkbox ${t.on!==false?'checked':''} onchange="S.tiers[${i}].on=this.checked;dirty()"></td><td><input type=number value="${t.n}" oninput="S.tiers[${i}].n=N(this.value);dirty()"></td><td><input type=number value="${t.f}" oninput="S.tiers[${i}].f=N(this.value);dirty()"></td><td><input type=number value="${t.r}" oninput="S.tiers[${i}].r=N(this.value);dirty()"></td><td><button class=s onclick="S.tiers.splice(${i},1);inputs();dirty()">✕</button></td></tr>`).join('')}
function addTier(){S.tiers.push({n:1,f:10,r:1,on:true});inputs();dirty()}
const dt=(y,m,d)=>new Date(y,m,d),ad=(d,n)=>dt(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fd=d=>`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
const pd=s=>{const[a,b,c]=(s||D.start).split('-').map(Number);return dt(a,b-1,c)};
const split=n=>{const b=Math.floor(n/7),r=n%7;return Array.from({length:7},(_,i)=>b+(i<r?1:0)).join('·')};
const tier=n=>S.tiers.find(t=>t.n==n);
function sim(){const s=pd(S.start),wk=N(S.mon)/30*7;let fire=N(S.fire),ref=N(S.ref);
const st=S.stages.map(x=>({...x,date:x.done?'✓':null,wk:null}));
const left=()=>st.filter(x=>!x.done&&!x.date),done=(we,k)=>{const ms=[];for(const x of left()){if(ref>=x.r&&fire>=x.f){fire-=x.f;ref-=x.r;x.date=we;x.wk=k;ms.push(x.n)}else break}return ms};
const rows=[],gaps=[];done(s,0);
S.plan.forEach((n,k)=>{const ws=ad(s,7*k),we=ad(ws,6);
const t=tier(n)||{n:0,f:0,r:0};if(fire<t.f)gaps.push({k:k+1,d:ws,short:t.f-fire});
fire-=t.f;ref+=t.r;fire+=wk;
const ms=done(we,k+1),res=fire-left().reduce((a,x)=>a+N(x.f),0),nx=left()[0];
rows.push({k:k+1,ws,we,n,t,fire,ref,ms,res,gap:nx?nx.r-ref:0,nx})});
return{rows,st,gaps}}
function render(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
const rem=S.stages.filter(x=>!x.done),bf=rem.reduce((a,x)=>a+N(x.f),0),br=rem.reduce((a,x)=>a+N(x.r),0);
const W=Math.max(1,N(S.weeks));while(S.plan.length<W)S.plan.push(0);S.plan.length=W;
const r=sim(),ex=S.plan.reduce((a,n)=>a+(tier(n)?.f||0),0),gain=S.plan.reduce((a,n)=>a+(tier(n)?.r||0),0);
const avail=N(S.fire)+N(S.mon)/30*7*W,sur=avail-bf-ex;
const k=(l,v,c)=>`<div>${l}<b class="${c||''}">${v}</b></div>`;
$('ov').innerHTML=k(T('k1'),fm(bf))+k(T('k2'),fm(br))+k(T('k3'),fm(ex))+k(T('k4'),fm(gain),gain+N(S.ref)>=br?'ok':'bad')+
k(T('k5'),fm(avail))+k(T('k6'),fm(bf+ex))+k(T('k7'),fm(sur),sur<0?'bad':'ok');
let w='';if(gain+N(S.ref)<br)w+=`<p class=bad>${T('w1',br-gain-N(S.ref))}</p>`;
if(r.gaps.length)w+=`<p class=bad>${T('w2',r.gaps.slice(0,5).map(g=>T('wg',g.k,fd(g.d),fm(g.short))).join(T('wSep'))+(r.gaps.length>5?'…':''))}</p>`;
else w+=`<p class=ok>${T('w3')}</p>`;
$('warn').innerHTML=w;
let prev=null;$('ms').innerHTML=`<tr><th>${T('mh1')}</th><th>${T('mh2')}</th><th>${T('mh3')}</th><th>${T('mh4')}</th><th>${T('mh5')}</th><th>${T('mh6')}</th></tr>`+
r.st.map(x=>{if(x.done)return`<tr><td>${T('stg',x.n)}</td><td colspan=5 class=ok>${T('mDone')}</td></tr>`;
if(!x.date)return`<tr><td>${T('stg',x.n)}</td><td colspan=5 class=bad>${T('mMiss')}</td></tr>`;
const row=r.rows[x.wk-1],gp=prev===null?T('wk',x.wk):T('wk',x.wk-prev);prev=x.wk;
return`<tr class=ms><td>${T('stg',x.n)}</td><td>${fd(x.date)}</td><td>${x.wk}</td><td>${gp}</td><td>${row?fm(row.ref):'-'}</td><td>${row?fm(row.fire):'-'}</td></tr>`}).join('');
$('pl').innerHTML=`<tr><th>${T('ph1')}</th><th>${T('ph2')}</th><th>${T('ph3')}</th><th>${T('ph4')}</th><th>${T('ph5')}</th><th>${T('ph6')}</th><th>${T('ph7')}</th><th>${T('ph8')}</th><th>${T('ph9')}</th><th>${T('ph10')}</th></tr>`+
r.rows.map((x,i)=>`<tr class="${x.ms.length?'ms':''}"><td>${x.k}${x.ms.length?T('ms',x.ms.join('/')):''}</td><td>${fd(x.ws).slice(5)}–${fd(x.we).slice(5)}</td><td><select onchange="S.plan[${i}]=N(this.value);render()"><option value=0>${T('none')}</option>${S.tiers.filter(t=>t.on!==false||t.n==x.n).map(t=>`<option value=${t.n} ${t.n==x.n?'selected':''}>${T('times',t.n)}</option>`).join('')}</select></td><td>${split(x.n)}</td><td>${fm(x.t.f)}</td><td>${x.t.r}</td><td>${fm(x.ref)}</td><td class="${x.fire<0?'bad':''}">${fm(x.fire)}</td><td class="${x.res<0?'bad':''}">${fm(x.res)}</td><td>${x.nx?Math.max(0,x.gap):'—'}</td></tr>`).join('');
const need=Math.max(0,br-N(S.ref)),on=S.tiers.filter(t=>t.on!==false),mx=Math.max(0,...on.map(t=>t.r));
$('hint').textContent=mx?T('hint',need,mx,Math.ceil(need/mx)):'';
$('st').textContent=T('okS');$('st').className=''}
function calc(){const rem=S.stages.filter(x=>!x.done),need=Math.max(0,rem.reduce((a,x)=>a+N(x.r),0)-N(S.ref)),W=Math.max(1,N(S.weeks)),T_=S.tiers.filter(t=>t.on!==false&&t.n>0&&t.r>0),I_=1e18;
if(!need){S.plan=Array(W).fill(0);return render()}
if(!T_.length){alert(T('a1'));return}
const f=[],p=[];for(let j=0;j<=W;j++){f.push(Array(need+1).fill(I_));p.push(Array(need+1).fill(null))}f[0][0]=0;
for(let j=0;j<W;j++)for(let r=0;r<need;r++){if(f[j][r]>=I_)continue;T_.forEach((t,i)=>{const q=Math.min(need,r+t.r),c=f[j][r]+t.f;if(c<f[j+1][q]){f[j+1][q]=c;p[j+1][q]=[r,i]}})}
let bj=-1,bc=I_;for(let j=1;j<=W;j++)if(f[j][need]<bc){bc=f[j][need];bj=j}
if(bj<0){alert(T('a2'));S.plan=Array(W).fill(0);return render()}
const pl=[];let r=need;for(let j=bj;j>0;j--){const[a,i]=p[j][r];pl.push(T_[i].n);r=a}
pl.sort((a,b)=>tier(b).r-tier(a).r);while(pl.length<W)pl.push(0);S.plan=pl;render()}
applyStatic();inputs();calc();
</script></body></html>
